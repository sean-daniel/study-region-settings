<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>校内外实践免费活动 · 教育局审核</title><style>
:root{--blue:#2864f0;--line:#e5e9f0;--page:#f1f3f6;--muted:#858d99;--ink:#252a33}*{box-sizing:border-box}body{margin:0;background:var(--page);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;color:var(--ink)}button,input,select{font:inherit}button{cursor:pointer}.top{height:56px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:22px;padding:0 20px;position:sticky;top:0;z-index:3}.brand{font-weight:700;color:var(--blue)}.crumb{color:#58616e}.right{margin-left:auto;color:#707987}.shell{display:grid;grid-template-columns:215px 1fr;min-height:calc(100vh - 56px)}aside{background:#fff;border-right:1px solid var(--line);padding-top:14px}.nav{height:48px;padding:0 22px;display:flex;align-items:center;color:#404956}.nav.active{background:#eaf2ff;color:var(--blue);border-right:3px solid var(--blue)}main{min-width:0}.tabs{height:50px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 24px;color:var(--blue)}.content{padding:16px}.panel{background:white;border:1px solid #e0e5ed;border-radius:4px;margin-bottom:12px;padding:16px 20px}.filters{display:flex;gap:18px;align-items:center;flex-wrap:wrap}.field{display:flex;align-items:center;gap:9px}.input,.select{height:35px;border:1px solid #d6dce6;border-radius:4px;padding:0 10px;min-width:180px}.btn{height:35px;border:1px solid var(--blue);background:var(--blue);color:white;border-radius:4px;padding:0 16px}.btn.gray{background:#fff;border-color:#d6dce6;color:#59616d}.btn.green{background:#21a365;border-color:#21a365}.btn.red{background:#fff;color:#df5656;border-color:#f0b3b3}.listhead{display:flex;align-items:center;justify-content:space-between}.subtabs{display:flex;gap:26px;border-bottom:1px solid var(--line);margin:-2px 0 12px}.subtabs button{border:0;background:none;padding:10px 3px;color:#515a67}.subtabs button.active{color:var(--blue);border-bottom:2px solid var(--blue)}.table-wrap{overflow:auto}.table{width:100%;min-width:900px;border-collapse:collapse}.table th,.table td{padding:12px 10px;border-bottom:1px solid var(--line);text-align:center}.table th{background:#f7f8fa;color:#5c6572;font-weight:600}.action{color:var(--blue);cursor:pointer;margin:0 6px;white-space:nowrap}.tag{display:inline-block;padding:2px 9px;background:#fff4e6;color:#d88920;border-radius:3px}.tag.ok{background:#eaf8ef;color:#21864b}.tag.no{background:#fff0f0;color:#d84d4d}.empty{text-align:center;color:#929aa5;padding:36px}.modal-bg{position:fixed;inset:0;z-index:5;background:#0007;display:flex;align-items:center;justify-content:center;padding:16px}.hidden{display:none!important}.modal{background:#fff;border-radius:5px;width:min(900px,100%);max-height:94vh;display:flex;flex-direction:column;position:relative}.modal-title{padding:15px 22px;border-bottom:1px solid var(--line);font-size:17px}.close{position:absolute;right:14px;top:7px;background:none;border:0;color:#9299a2;font-size:24px}.body{padding:20px 24px;overflow:auto}.foot{padding:13px 20px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:10px}.details{display:grid;grid-template-columns:120px 1fr;gap:13px 16px}.label{color:var(--muted)}.value{overflow-wrap:anywhere}.pdfs{grid-column:1/-1;display:grid;gap:8px}.pdf{display:flex;gap:12px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:4px}.pdf-name{flex:1;overflow-wrap:anywhere}.frame{width:100%;height:65vh;border:1px solid var(--line)}.comment{width:100%;min-height:90px;border:1px solid #d6dce6;border-radius:4px;padding:10px}.toast{position:fixed;z-index:8;top:72px;left:50%;transform:translateX(-50%);background:#27364d;color:white;padding:10px 18px;border-radius:4px;display:none}@media(max-width:700px){.shell{grid-template-columns:1fr}aside{display:flex;overflow:auto;padding:0;height:45px}.nav{height:45px;white-space:nowrap;padding:0 12px}.nav:not(.active){display:none}.content{padding:9px}.panel{padding:13px}.filters .field{width:100%;justify-content:space-between}.input,.select{width:65%}.details{grid-template-columns:90px 1fr}.top{padding:0 10px}.right{display:none}}
</style></head><body>
<header class="top"><div class="brand">🌈 贵州省研学综合服务网</div><span>☰</span><div class="crumb">工作台　/　出行管理　/　校内外实践免费活动审核</div><div class="right">教育局管理员　⌄</div></header><div class="shell"><aside><div class="nav">⌂　工作台</div><div class="nav">▦　出行管理</div><div class="nav active">　校内外实践免费活动</div><div class="nav">　研学出行</div><div class="nav">▤　审核管理</div><div class="nav">▣　消息中心</div></aside><main><div class="tabs">校内外实践免费活动审核</div><div class="content"><section class="panel filters"><label class="field">活动名称 <input class="input" id="searchName" placeholder="请输入活动名称"></label><label class="field">学校名称 <input class="input" id="searchSchool" placeholder="请输入学校名称"></label><label class="field">活动类型 <select class="select" id="searchType"><option value="">全部</option><option>外出</option><option>校内</option></select></label><button class="btn" id="search">搜索</button><button class="btn gray" id="reset">重置</button></section><section class="panel"><div class="subtabs"><button class="active" data-tab="待审核">我的待办 <b id="pendingCount">0</b></button><button data-tab="已办">我的已办</button><button data-tab="全部">全部活动</button></div><div class="listhead"><span>学校提交的校内外实践免费活动</span><span style="color:#929aa5">审核结果将同步回学校端</span></div><div class="table-wrap"><table class="table"><thead><tr><th>活动名称</th><th>活动类型</th><th>学校</th><th>时间</th><th>地点</th><th>出行人数</th><th>资料数量</th><th>审核状态</th><th>操作</th></tr></thead><tbody id="rows"></tbody></table></div></section></div></main></div>
<div class="modal-bg hidden" id="detailModal"><section class="modal"><div class="modal-title">活动审核详情</div><button class="close" data-close="detailModal">×</button><div class="body"><div class="details"><div class="label">活动名称</div><div class="value" id="dName"></div><div class="label">活动类型</div><div class="value" id="dType"></div><div class="label">学校</div><div class="value" id="dSchool"></div><div class="label">时间</div><div class="value" id="dTime"></div><div class="label">地点</div><div class="value" id="dPlace"></div><div class="label">出行人数</div><div class="value" id="dPeople"></div><div class="label">提交时间</div><div class="value" id="dCreated"></div><div class="label">审核状态</div><div class="value" id="dStatus"></div><div class="label">审核意见</div><div class="value" id="dComment">—</div><div class="label">上传资料</div><div class="pdfs" id="dPdfs"></div><div class="label">审核意见</div><div><textarea class="comment" id="reviewComment" placeholder="通过时可选填；驳回时请填写原因"></textarea></div></div></div><div class="foot"><button class="btn gray" data-close="detailModal">关闭</button><button class="btn red" id="reject">驳回</button><button class="btn green" id="approve">审核通过</button></div></section></div>
<div class="modal-bg hidden" id="previewModal"><section class="modal"><div class="modal-title" id="previewTitle">PDF预览</div><button class="close" data-close="previewModal">×</button><div class="body"><iframe class="frame" id="previewFrame" title="PDF预览"></iframe></div><div class="foot"><button class="btn gray" data-close="previewModal">关闭</button></div></section></div><div class="toast" id="toast"></div>
<script>
const KEY='freePracticeActivities', $=id=>document.getElementById(id);let activities=[],tab='待审核',selectedId=null,previewUrl=null;const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function sample(){return[{id:'demo-activity-001',name:'白云区第一小学科技实践活动',activityType:'外出',time:'2026-10-28 09:00',place:'贵州省科技馆',people:120,schoolName:'白云区第一小学',status:'待审核',createdAt:'2026-10-16 09:30:00',pdfs:[{name:'校外实践活动方案.pdf',demoPdf:true},{name:'安全预案.pdf',demoPdf:true}]},{id:'demo-activity-002',name:'秋季自然教育实践活动',activityType:'校内',time:'2026-11-06 08:30',place:'白云区第一小学',people:86,schoolName:'白云区第一小学',status:'待审核',createdAt:'2026-10-16 10:15:00',pdfs:[{name:'自然教育活动方案.pdf',demoPdf:true},{name:'安全须知.pdf',demoPdf:true}]}]}
function load(){try{const v=JSON.parse(localStorage.getItem(KEY)||'null');activities=Array.isArray(v)?v:sample();if(!Array.isArray(v))save()}catch{activities=sample()}}function save(){localStorage.setItem(KEY,JSON.stringify(activities))}function toast(m){const t=$('toast');t.textContent=m;t.style.display='block';clearTimeout(toast.timer);toast.timer=setTimeout(()=>t.style.display='none',1800)}
function stateLabel(s){return s==='已通过'?'<span class="tag ok">已通过</span>':s==='已驳回'?'<span class="tag no">已驳回</span>':'<span class="tag">待审核</span>'}
function render(){const n=activities.filter(a=>(a.status||'待审核')==='待审核').length;$('pendingCount').textContent=n;let rows=activities.map((a,i)=>({...a,_index:i}));if(tab==='待审核')rows=rows.filter(a=>(a.status||'待审核')==='待审核');if(tab==='已办')rows=rows.filter(a=>['已通过','已驳回'].includes(a.status));const name=$('searchName').value.trim(),school=$('searchSchool').value.trim(),type=$('searchType').value;rows=rows.filter(a=>(a.name||'').includes(name)&&(a.schoolName||'').includes(school)&&(!type||(a.activityType||'外出')===type));$('rows').innerHTML=rows.length?rows.map(a=>`<tr><td>${esc(a.name)}</td><td>${esc(a.activityType||'外出')}</td><td>${esc(a.schoolName||'白云区第一小学')}</td><td>${esc(a.time)}</td><td>${esc(a.place)}</td><td>${esc(a.people)} 人</td><td>${(a.pdfs||[]).length} 份</td><td>${stateLabel(a.status||'待审核')}</td><td><span class="action" data-open="${esc(a.id)}">详情 / 审核</span></td></tr>`).join(''):'<tr><td colspan="9" class="empty">暂无符合条件的活动</td></tr>';document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>openDetail(b.dataset.open))}
function pdfBlob(pdf){if(pdf.dataUrl)return fetch(pdf.dataUrl).then(r=>r.blob());const nl='\n',stream='BT /F1 18 Tf 72 720 Td (PDF preview sample) Tj ET',o=['<</Type/Catalog/Pages 2 0 R>>','<</Type/Pages/Kids[3 0 R]/Count 1>>','<</Type/Page/Parent 2 0 R/MediaBox[0 0 612 792]/Resources<</Font<</F1 4 0 R>>>>/Contents 5 0 R>>','<</Type/Font/Subtype/Type1/BaseFont/Helvetica>>',`<</Length ${stream.length}>>stream${nl}${stream}${nl}endstream`];let x='%PDF-1.4'+nl,offs=[0];o.forEach((v,i)=>{offs.push(x.length);x+=`${i+1} 0 obj${v}endobj${nl}`});const pos=x.length;x+=`xref${nl}0 ${o.length+1}${nl}0000000000 65535 f ${nl}`;offs.slice(1).forEach(v=>x+=`${String(v).padStart(10,'0')} 00000 n ${nl}`);x+=`trailer<</Size ${o.length+1}/Root 1 0 R>>${nl}startxref${nl}${pos}${nl}%%EOF`;return Promise.resolve(new Blob([x],{type:'application/pdf'}))}
function preview(pdf){pdfBlob(pdf).then(blob=>{if(previewUrl)URL.revokeObjectURL(previewUrl);previewUrl=URL.createObjectURL(blob);$('previewFrame').src=previewUrl;$('previewTitle').textContent='PDF预览 · '+pdf.name;$('previewModal').classList.remove('hidden')})}function download(pdf){pdfBlob(pdf).then(blob=>{const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=pdf.name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1200)})}
function openDetail(id){const a=activities.find(x=>x.id===id);if(!a)return;selectedId=id;$('dName').textContent=a.name;$('dType').textContent=a.activityType||'外出';$('dSchool').textContent=a.schoolName||'白云区第一小学';$('dTime').textContent=a.time;$('dPlace').textContent=a.place;$('dPeople').textContent=(a.people||0)+' 人';$('dCreated').textContent=a.createdAt||'—';$('dStatus').innerHTML=stateLabel(a.status||'待审核');$('dComment').textContent=a.reviewComment||'—';$('reviewComment').value='';const atts=a.attachments||[],docs=atts.length?atts.filter(x=>x.file).map(x=>({...x.file,materialName:x.name})):a.pdfs||[];$('dPdfs').innerHTML=atts.length?atts.map((x,i)=>`<div class="pdf"><span>${x.file?'📄':'○'}</span><span class="pdf-name"><b>${esc(x.name)}</b>${x.required?'（必传）':'（选传）'} · ${x.file?esc(x.file.name):'未上传'}<br><small style="color:#929aa5">${esc(x.description||'')} · 格式 ${esc(x.formats||'pdf')} · 不超过 ${Number(x.size)||300} MB</small></span>${x.file?`<button class="btn gray" data-preview="${i}">预览</button><button class="btn gray" data-download="${i}">下载</button>`:''}</div>`).join(''):docs.length?docs.map((p,i)=>`<div class="pdf"><span>📄</span><span class="pdf-name">${esc(p.name)}</span><button class="btn gray" data-preview="${i}">预览</button><button class="btn gray" data-download="${i}">下载</button></div>`).join(''):'<div style="color:#929aa5">暂无上传资料</div>';document.querySelectorAll('[data-preview]').forEach(b=>b.onclick=()=>preview(docs[+b.dataset.preview]));document.querySelectorAll('[data-download]').forEach(b=>b.onclick=()=>download(docs[+b.dataset.download]));const pending=(a.status||'待审核')==='待审核';$('approve').classList.toggle('hidden',!pending);$('reject').classList.toggle('hidden',!pending);$('reviewComment').disabled=!pending;$('detailModal').classList.remove('hidden')}
function review(status){const i=activities.findIndex(a=>a.id===selectedId);if(i<0)return;const comment=$('reviewComment').value.trim();if(status==='已驳回'&&!comment){toast('请填写驳回原因');return}activities[i]={...activities[i],status,reviewComment:comment,reviewedAt:new Date().toLocaleString('zh-CN',{hour12:false})};save();$('detailModal').classList.add('hidden');render();toast(status==='已通过'?'审核已通过并同步至学校端':'已驳回并同步至学校端')}
$('approve').onclick=()=>review('已通过');$('reject').onclick=()=>review('已驳回');document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('active',x===b));render()});$('search').onclick=render;$('reset').onclick=()=>{$('searchName').value='';$('searchSchool').value='';$('searchType').value='';render()};document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>{const el=$(b.dataset.close);el.classList.add('hidden');if(el.id==='previewModal'&&previewUrl){URL.revokeObjectURL(previewUrl);previewUrl=null;$('previewFrame').src='about:blank'}});document.querySelectorAll('.modal-bg').forEach(m=>m.onclick=e=>{if(e.target===m)m.classList.add('hidden')});window.addEventListener('storage',e=>{if(e.key===KEY){load();render()}});load();render();
</script></body></html>
