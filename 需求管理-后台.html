<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>需求管理｜资料提交地址（管理端）</title>
<style>
:root{--blue:#2864f0;--ink:#262c36;--muted:#858d9a;--line:#e3e7ed;--bg:#f3f5f8}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}button,input,textarea{font:inherit}.top{height:54px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 20px;gap:24px;position:sticky;top:0}.brand{color:var(--blue);font-weight:700;white-space:nowrap}.crumb{color:#555e6b}.right{margin-left:auto;display:flex;align-items:center;gap:20px;color:#68717d}.shell{min-height:calc(100vh - 54px);display:grid;grid-template-columns:195px minmax(0,1fr)}.sidebar{background:white;border-right:1px solid var(--line);padding-top:12px}.nav{padding:13px 18px}.nav.active{color:var(--blue);background:#edf3ff;border-right:3px solid var(--blue)}.nav.sub{padding-left:48px}.main{padding:18px;min-width:0}.tab{color:var(--blue);padding:0 4px 12px;border-bottom:2px solid var(--blue);margin-bottom:14px}.card{padding:18px 20px;background:#fff;border:1px solid var(--line);border-radius:5px;margin-bottom:15px}.filters{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.filters input{height:34px;padding:0 10px;border:1px solid #d8dde6;border-radius:4px}.btn{border:1px solid var(--blue);border-radius:4px;background:var(--blue);color:white;padding:8px 16px;cursor:pointer}.btn.light{color:var(--blue);background:white;border-color:#b7c9ff}.btn.gray{color:#59616d;background:#fff;border-color:#d7dce5}.table{border-collapse:collapse;width:100%;margin-top:14px;min-width:780px}.table th,.table td{text-align:left;padding:12px 10px;border-bottom:1px solid var(--line)}.table th{background:#f7f8fa;color:#606977}.table-wrap{overflow:auto}.link{color:var(--blue);cursor:pointer;margin-right:14px}.tag{color:#bf7a20;background:#fff4df;border-radius:3px;padding:3px 8px}.overlay{position:fixed;inset:0;background:#0007;display:flex;justify-content:center;align-items:center;padding:18px}.dialog{width:min(910px,100%);max-height:94vh;background:#fff;border-radius:4px;display:flex;flex-direction:column;box-shadow:0 10px 36px #0002}.head{height:64px;flex:none;border-bottom:1px solid var(--line);padding:19px 30px;font-size:17px}.close{position:absolute;margin:9px 0 0 min(850px,calc(100vw - 75px));font-size:23px;color:#7e8792;border:0;background:none;cursor:pointer}.body{overflow:auto;padding:16px 30px 22px}.title{border-left:4px solid var(--blue);padding-left:9px;font-size:15px;font-weight:600;margin:7px 0 14px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px 22px}.field{min-width:0}.wide{grid-column:1/-1}.label{display:block;margin-bottom:6px;color:#4f5763}.req{color:#ed5954}.control{width:100%;height:36px;border:1px solid #d7dce5;border-radius:4px;padding:7px 10px;color:#464e59;outline:none}.control:focus{border-color:#88a9ff;box-shadow:0 0 0 2px #2864f01a}.area{height:58px;resize:vertical}.foot{flex:none;display:flex;justify-content:center;gap:12px;padding:13px;border-top:1px solid #edf0f4}.toast{position:fixed;top:68px;left:50%;transform:translate(-50%,-10px);opacity:0;background:#26364f;color:#fff;padding:9px 16px;border-radius:4px;transition:.18s;pointer-events:none}.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:700px){.shell{grid-template-columns:1fr}.sidebar{display:none}.right{display:none}.top{padding:0 12px}.grid{grid-template-columns:1fr 1fr}.body{padding:14px}.head{padding-left:18px}}
@media(max-width:460px){.grid{grid-template-columns:1fr}.wide{grid-column:auto}.dialog{max-height:96vh}}
</style>
</head>
<body>
<header class="top"><div class="brand">🌈 贵州省研学综合服务网</div><span>☰</span><div class="crumb">工作台　/　出行管理　/　需求管理</div><div class="right"><a href="需求公示-详情.html" target="_blank" style="color:inherit;text-decoration:none"><button class="btn">◧ 访问门户预览</button></a><span>当前单位 白云区第一小学</span></div></header>
<div class="shell"><aside class="sidebar"><div class="nav">⌂　工作台</div><div class="nav active">▦　出行管理</div><div class="nav sub">教育实践计划</div><div class="nav sub active">需求管理</div><div class="nav sub">出行申报</div><div class="nav">▤　订单管理</div><div class="nav">▧　评价管理</div><div class="nav">▣　组织管理</div></aside>
<main class="main"><div class="tab">工作台　　需求管理 ×</div><section class="card"><div class="filters">项目名称　<input placeholder="请输入项目名称">　状态　<input placeholder="请选择状态"><button class="btn">查询</button><button class="btn gray">重置</button></div></section><section class="card"><button class="btn" id="add">新增</button><div class="table-wrap"><table class="table"><thead><tr><th>项目名称</th><th>项目类型</th><th>资料提交截止时间</th><th>需求联系人</th><th>状态</th><th>操作</th></tr></thead><tbody><tr><td>白云区第一小学研学活动</td><td>研学实践</td><td>2025-12-20 23:59</td><td>张主任</td><td><span class="tag">招标中</span></td><td><a class="link" href="需求公示-详情.html" target="_blank">详情</a><span class="link" id="edit">编辑</span></td></tr></tbody></table></div></section></main></div>
<div class="overlay" id="overlay"><section class="dialog"><div class="head" id="dialogTitle">添加</div><button class="close" id="close" aria-label="关闭">×</button><div class="body">
<div class="title">项目信息</div><div class="grid"><div class="field"><label class="label"><span class="req">*</span> 项目名称</label><input class="control" value="白云区第一小学研学活动"></div><div class="field"><label class="label"><span class="req">*</span> 研学区域</label><input class="control" value="白云区"></div><div class="field"><label class="label"><span class="req">*</span> 出行人数</label><input class="control" value="453"></div><div class="field wide"><label class="label"><span class="req">*</span> 课程设计</label><textarea class="control area">参观博物馆了解桥梁历史，实践体验活动提高动手能力</textarea></div><div class="field wide"><label class="label">其他要求</label><textarea class="control area">需要提供专业讲解员，确保活动安全有序进行</textarea></div></div>
<div class="title" style="margin-top:20px">需求要求</div><div class="grid"><div class="field"><label class="label"><span class="req">*</span> 所需资质</label><input class="control" value="营业执照、法人身份证复印件"></div><div class="field"><label class="label"><span class="req">*</span> 所需文件</label><input class="control" value="研学出行活动方案、研学出行安全预案"></div><div class="field"><label class="label"><span class="req">*</span> 需求联系人</label><input class="control" value="张主任"></div><div class="field"><label class="label"><span class="req">*</span> 联系方式</label><input class="control" value="13800138000"></div><div class="field"><label class="label"><span class="req">*</span> 资料提交地址</label><input class="control" id="address" type="text" value="gy8x@example.com" placeholder="请输入资料提交地址" autocomplete="off"></div><div class="field"><label class="label"><span class="req">*</span> 需求时间段</label><input class="control" value="2025-12-01 00:00 至 2025-12-20 23:59"></div><div class="field wide"><label class="label"><span class="req">*</span> 资质条件要求</label><textarea class="control area">具备研学旅行服务资质，有相关活动组织经验</textarea></div><div class="field wide"><label class="label">其他要求</label><textarea class="control area">需要提供详细的活动方案和安全预案</textarea></div></div>
</div><div class="foot"><button class="btn gray" id="cancel">取 消</button><button class="btn light" id="draft">保存草稿</button><button class="btn" id="publish">发布</button></div></section></div><div class="toast" id="toast"></div>
<script>
const address=document.getElementById('address'),toast=document.getElementById('toast'),overlay=document.getElementById('overlay');
function persist(){localStorage.setItem('studyMaterialsSubmissionAddress',address.value)}
function notify(text){toast.textContent=text;toast.classList.add('show');clearTimeout(notify.timer);notify.timer=setTimeout(()=>toast.classList.remove('show'),1600)}
address.addEventListener('input',persist);document.getElementById('close').onclick=()=>overlay.style.display='none';document.getElementById('cancel').onclick=()=>{overlay.style.display='none';notify('已取消')};document.getElementById('add').onclick=()=>{document.getElementById('dialogTitle').textContent='添加';overlay.style.display='flex'};document.getElementById('edit').onclick=()=>{document.getElementById('dialogTitle').textContent='编辑';overlay.style.display='flex'};document.getElementById('draft').onclick=()=>{persist();notify('草稿已保存')};document.getElementById('publish').onclick=()=>{persist();notify('需求已发布')};document.addEventListener('keydown',e=>{if(e.key==='Escape')overlay.style.display='none'});
</script>
</body>
</html>
